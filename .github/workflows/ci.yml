name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # One platform's failure must not cancel the others: their
      # results are independent evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build release binary
        run: go build -trimpath -o exiftool-mcp-go ./cmd/exiftool-mcp-go
